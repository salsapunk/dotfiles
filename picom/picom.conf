#################################
#       Backend / Performance   #
#################################
backend = "glx";        # renderização via GPU (mais rápido que "xrender")
vsync = true;            # evita tearing na tela

#################################
#            Shadows            #
#################################
shadow = true;
shadow-radius = 12;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-opacity = 0.2;
shadow-exclude = [
  "class_g = 'i3bar'",
  "class_g = 'dmenu'",
  "_GTK_FRAME_EXTENTS@:c"
];

#################################
#             Fading            #
#################################
fading = true;
fade-in-step = 0.01;
fade-out-step = 0.01;
fade-delta = 2;

#################################
#           Transparency        #
#################################
inactive-opacity = 0.92;
active-opacity = 1.0;
frame-opacity = 0.9;
inactive-opacity-override = false;

opacity-rule = [
  "80:class_g = 'Alacritty' && focused",
  "70:class_g = 'Alacritty' && !focused",
  "80:class_g = 'Polybar'"
];

#################################
#              Blur             #
#################################
blur: {
  method = "dual_kawase";
  strength = 5;
}
blur-background = false;
blur-background-exclude = [
  "class_g = 'slop'",
  "class_g = 'Alacritty'",
  "window_type = 'dock'"
];

#################################
#         Rounded Corners       #
#################################
corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

#################################
#      General Window Rules     #
#################################
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;

wintypes:
{
  tooltip = { fade = true; shadow = false; opacity = 0.9; focus = true; }
  dock = { shadow = false; }
  dnd = { shadow = false; }
  popup_menu = { opacity = 0.9; }
  dropdown_menu = { opacity = 0.9; }
};
