[colors]
background = #282828
background-alt = #3c3836
foreground = #ebdbb2
primary = #fabd2f
secondary = #8ec07c
alert = #fb4934
disabled = #928374

[bar/example]
width = 100%
height = 17pt
radius = 0
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 2pt
border-size = 0
padding-left = 0
padding-right = 1
padding-top = 1
module-margin = 1
separator = |
separator-foreground = ${colors.disabled}
font-0 = Input Mono:size=12;2
modules-left = xworkspaces xwindow
modules-right = filesystem pulseaudio memory eth wlan battery date
cursor-click = pointer
enable-ipc = true

[module/xworkspaces]
type = internal/xworkspaces
label-active = %name%
label-active-foreground = ${colors.primary}
label-active-padding = 1
label-occupied = %name%
label-occupied-padding = 1
label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = 

[module/filesystem]
type = internal/fs
interval = 25
mount-0 = /
mount-1 = /home
label-mounted = %{F#fabd2f}%mountpoint%: %{F#ebdbb2}%free% (free)

[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>
label-volume = %percentage%%
label-muted = muted
label-muted-foreground = ${colors.disabled}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}
label = %percentage_used%%

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>

[module/eth]
inherit = network-base
interface-type = wired
label-connected = eth: %local_ip%
label-disconnected =

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{F#fabd2f}WiFi: %{F#ebdbb2}%essid%
label-disconnected = WiFi: desconectado
label-disconnected-foreground = ${colors.disabled}

[module/battery]
type = internal/battery
battery = BAT1
adapter = AC
full-at = 99
format-charging = <label-charging>
format-discharging = <label-discharging>
label-charging = BAT %percentage%% (carregando)
label-discharging = %{F#fabd2f}BAT %{F#ebdbb2}%percentage%%
format-full-prefix = "BAT "
format-full-prefix-foreground = ${colors.primary}

[module/date]
type = internal/date
interval = 1
date = %d/%m - %H:%M
label = %date%
label-foreground = ${colors.foreground}

[settings]
screenchange-reload = true
pseudo-transparency = true
